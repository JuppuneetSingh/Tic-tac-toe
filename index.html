<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main>

        <h1>Tic Tac Toe</h1>

        <div class="players">

            <div class="player">
                <label for="player-one">Player 1</label>

                <input
                    type="text"
                    id="player-one"
                    placeholder="Enter name"
                >
            </div>


            <div class="player">
                <label for="player-two">Player 2</label>

                <input
                    type="text"
                    id="player-two"
                    placeholder="Enter name"
                >
            </div>


            <button id="start-button" type="button">
                Start Game
            </button>

        </div>


        <div id="turn-display">
            Enter player names and start the game
        </div>


        <div id="result"></div>


        <button id="restart-button" type="button">
            Restart Game
        </button>


        <div class="gameboard"></div>

    </main>

</body>

</html>
